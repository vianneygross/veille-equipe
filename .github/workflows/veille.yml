name: Veille

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  models: read
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optionnel : LLM_API_KEY, LLM_BASE_URL, LLM_MODEL pour un autre fournisseur
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
      - name: Commit des données
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add site/data/items.json
          git diff --staged --quiet || git commit -m "chore: mise à jour de la veille" && git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
